{% if user.is_authenticated %}
<form method="post" class="star-form" data-experience-star-form>
    {% csrf_token %}
    <button type="submit" class="button button-star" data-experience-star-button>
        <span aria-hidden="true">★</span>
        <span data-experience-star-label></span>
        <span class="star-count" data-experience-star-count></span>
    </button>
</form>
{% else %}
<a href="{% url 'main:login' %}" class="button button-star">
    Login untuk star (<span data-experience-star-count></span>)
</a>
{% endif %}
