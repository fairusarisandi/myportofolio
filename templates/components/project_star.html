<form method="post" action="${starUrl}" class="star-form">
    {% csrf_token %}
    <button type="submit" 
            class="button button-star${isStarredClass}"
            title="${starTitle}">
        <span aria-hidden="true">★</span>
        ${starText}
        <span class="star-count">${escapeHtml(project.star_count)}</span>
    </button>
</form>
