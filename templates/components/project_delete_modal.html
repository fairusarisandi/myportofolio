<button type="button"
        class="button button-danger"
        popovertarget="delete-project-${projectId}"
        aria-label="Hapus ${escapeHtml(project.name)}"
        title="Hapus proyek">
    Hapus
</button>
<div id="delete-project-${projectId}"
     class="project-delete-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="delete-project-title-${projectId}">
    <button type="button"
            class="project-delete-modal__backdrop"
            popovertarget="delete-project-${projectId}"
            popovertargetaction="hide"
            aria-label="Tutup konfirmasi hapus">×</button>
    <div class="project-delete-modal__content">
        <button type="button"
                class="project-delete-modal__close"
                popovertarget="delete-project-${projectId}"
                popovertargetaction="hide"
                aria-label="Tutup konfirmasi hapus">×</button>
        <h2 id="delete-project-title-${projectId}">Hapus Projek?</h2>
        <p>
            Apakah Anda yakin ingin menghapus
            <strong>${escapeHtml(project.name)}</strong>?
        </p>
        <div class="project-delete-modal__actions">
            <button type="button"
                    class="button button-secondary"
                    popovertarget="delete-project-${projectId}"
                    popovertargetaction="hide">Batal</button>
            <form method="post" action="${deleteUrl}">
                {% csrf_token %}
                <button type="submit" class="button button-danger">Ya, Hapus</button>
            </form>
        </div>
    </div>
</div>
